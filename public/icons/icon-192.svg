<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- Gallows -->
  <g stroke="#4a4a6a" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="120" y1="420" x2="220" y2="420"/>
    <line x1="170" y1="420" x2="170" y2="100"/>
    <line x1="170" y1="100" x2="320" y2="100"/>
    <line x1="200" y1="100" x2="170" y2="140"/>
    <line x1="320" y1="100" x2="320" y2="140"/>
  </g>
  
  <!-- Stick figure -->
  <g stroke="#eaeaea" stroke-width="7" stroke-linecap="round" fill="none">
    <!-- Head -->
    <circle cx="320" cy="172" r="32"/>
    <!-- Body -->
    <line x1="320" y1="204" x2="320" y2="310"/>
    <!-- Arms -->
    <line x1="320" y1="240" x2="275" y2="285"/>
    <line x1="320" y1="240" x2="365" y2="285"/>
    <!-- Legs -->
    <line x1="320" y1="310" x2="280" y2="380"/>
    <line x1="320" y1="310" x2="360" y2="380"/>
  </g>
  
  <!-- Face - X eyes -->
  <g stroke="#e94560" stroke-width="5" stroke-linecap="round">
    <line x1="305" y1="160" x2="315" y2="170"/>
    <line x1="315" y1="160" x2="305" y2="170"/>
    <line x1="325" y1="160" x2="335" y2="170"/>
    <line x1="335" y1="160" x2="325" y2="170"/>
  </g>
  
  <!-- Letters hint -->
  <g fill="#e94560" font-family="monospace" font-weight="bold" font-size="42" text-anchor="middle">
    <text x="256" y="470">R S S</text>
  </g>
  
  <!-- Underscores -->
  <g stroke="#e94560" stroke-width="4" stroke-linecap="round">
    <line x1="215" y1="478" x2="240" y2="478"/>
    <line x1="245" y1="478" x2="270" y2="478"/>
    <line x1="275" y1="478" x2="300" y2="478"/>
  </g>
</svg>